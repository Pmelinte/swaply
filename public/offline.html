<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Swaply</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 30px;
      padding: 15px;
      background: #f0f4ff;
      border-radius: 10px;
      color: #667eea;
      font-size: 14px;
      font-weight: 500;
    }

    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #667eea;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📵</div>
    <h1>Ești Offline</h1>
    <p>
      Nu te poți conecta la internet momentan. 
      Verifică conexiunea și încearcă din nou.
    </p>
    <button class="button" onclick="window.location.reload()">
      🔄 Încearcă Din Nou
    </button>
    
    <div class="status">
      <span class="pulse"></span>
      Unele funcționalități sunt disponibile offline
    </div>
  </div>

  <script>
    // Auto-retry when online
    window.addEventListener('online', () => {
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });

    // Check connection status
    function updateStatus() {
      const status = document.querySelector('.status');
      if (navigator.onLine) {
        status.innerHTML = '<span class="pulse"></span>Conexiune restabilită! Reîncarcă pagina.';
        status.style.background = '#d4edda';
        status.style.color = '#155724';
      }
    }

    setInterval(updateStatus, 2000);
  </script>
</body>
</html>
